name: AURIA legacy import (archived)

# AURIA already includes the original Levyra source.
# This workflow is intentionally read-only. In particular, it must never
# rsync the upstream project over AURIA/main or push a destructive commit.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  imported-source-notice:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout existing AURIA sources
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Show archive notice
        run: |
          echo "AURIA already contains the Levyra source and our improvements."
          echo "To update upstream safely, use a reviewed source-level merge."
          echo "Never overwrite the AURIA main branch with a fresh upstream copy."
