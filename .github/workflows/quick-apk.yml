name: AURIA Debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auria-debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build AURIA debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build isolated AURIA debug package
        run: ./gradlew --no-daemon :app:assembleDebug --stacktrace

      - name: Upload AURIA APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AURIA-Android-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
